services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-finance_app}
      MYSQL_USER: ${DB_USERNAME:-finance_app}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the root .env file}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in the root .env file}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - finance-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment: &backend-env
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: ${APP_KEY:?Generate APP_KEY with php artisan key:generate}
      APP_URL: http://localhost:${API_PORT:-8000}
      APP_TIMEZONE: America/Santo_Domingo
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-finance_app}
      DB_USERNAME: ${DB_USERNAME:-finance_app}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the root .env file}
      QUEUE_CONNECTION: database
      CACHE_STORE: database
      SESSION_DRIVER: database
      MAIL_MAILER: log
      CORS_ALLOWED_ORIGINS: http://localhost:${VITE_PORT:-5180}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      mysql:
        condition: service_healthy

  queue:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["php", "artisan", "queue:work", "--tries=3", "--timeout=90"]
    environment: *backend-env
    depends_on:
      mysql:
        condition: service_healthy

  scheduler:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["php", "artisan", "schedule:work"]
    environment: *backend-env
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  finance-mysql:
